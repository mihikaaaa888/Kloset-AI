[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # @capacitor/cli requires Node 22+; the site default can be older.
  NODE_VERSION = "22"
  # onnxruntime-node (via transformers) downloads a GPU binary we never use: the models run in the browser.
  ONNXRUNTIME_NODE_INSTALL = "skip"

[functions]
  node_bundler = "esbuild"

# All API calls go to the single Express-backed function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback so refreshing /wardrobe, /chat, etc. serves the app, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output and versioned hero videos never change under the same
# name, so browsers can keep them for a year instead of re-checking each visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
