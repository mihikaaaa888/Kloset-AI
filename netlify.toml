[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # @capacitor/cli requires Node 22+; the site default can be older.
  NODE_VERSION = "22"
  # onnxruntime-node (via transformers) downloads a GPU binary we never use: the models run in the browser.
  ONNXRUNTIME_NODE_INSTALL = "skip"

[functions]
  node_bundler = "esbuild"

# All API calls go to the single Express-backed function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback so refreshing /wardrobe, /chat, etc. serves the app, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output and versioned hero videos never change under the same
# name, so browsers can keep them for a year instead of re-checking each visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-U1fje8ka1wDkhb//zaSYcFIsZGfG6Ph+DWxunoLO/vg=' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=()"
